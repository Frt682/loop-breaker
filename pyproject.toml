[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-breaker"
version = "1.0.0"
description = "Stop AI coding agents from doom loops — detect, rollback, and steer Cursor/Claude agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LoopBreaker Contributors" }]
keywords = [
    "cursor",
    "ai-agent",
    "doom-loop",
    "rollback",
    "coding-agent",
    "claude",
    "copilot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/Frt682/loop-breaker"
Repository = "https://github.com/Frt682/loop-breaker"
Issues = "https://github.com/Frt682/loop-breaker/issues"

[project.scripts]
loop-breaker = "loop_breaker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loop_breaker*"]
